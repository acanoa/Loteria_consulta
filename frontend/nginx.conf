server {
    listen 80;
    server_name localhost;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location = / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files /apps/loteria-consulta/index.html /index.html =404;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        try_files /apps/loteria-consulta$uri $uri =404;
    }

    location /apps/loteria-consulta/ {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /apps/loteria-consulta/index.html /index.html;
    }

    # Proxy para redirigir peticiones API al backend
    location /api/ {
        proxy_pass http://loteria-backend:8000/api/;
        proxy_set_header X-Admin-Token ${LOTERIA_ADMIN_TOKEN};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /apps/loteria-consulta/api/ {
        proxy_pass http://loteria-backend:8000/api/;
        proxy_set_header X-Admin-Token ${LOTERIA_ADMIN_TOKEN};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
