version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: loteria_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loteria_backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/postgres}
      - AUTO_IMPORT_ENABLED=${AUTO_IMPORT_ENABLED:-true}
      - AUTO_IMPORT_HOUR=${AUTO_IMPORT_HOUR:-03:00}
      - AUTO_IMPORT_TIMEZONE=${AUTO_IMPORT_TIMEZONE:-Europe/Madrid}
    volumes:
      - ./backend/descargas:/app/descargas
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loteria_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
